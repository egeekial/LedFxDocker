name: Publish image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - requirements.txt
      - setup-files/**
      - tests/**
      - .github/workflows/publish-image.yml
  pull_request:
    branches: [master]
    paths:
      - Dockerfile
      - requirements.txt
      - setup-files/**
      - tests/**
      - .github/workflows/publish-image.yml
  schedule:
    - cron: "17 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ledfxdocker:smoke
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test critical-process recovery
        run: ./tests/smoke-restart.sh ledfxdocker:smoke

  build:
    name: Multi-architecture build
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/egeekial/ledfxdocker:latest
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
