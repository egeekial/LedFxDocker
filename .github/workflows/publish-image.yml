name: Publish image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - setup-files/**
      - tests/**
      - .github/workflows/publish-image.yml
  pull_request:
    branches: [master]
    paths:
      - Dockerfile
      - setup-files/**
      - tests/**
      - .github/workflows/publish-image.yml
  schedule:
    # Weekly rebuild to refresh Debian packages, Python dependencies, and Snapclient.
    - cron: "17 5 * * 0"
    # Release poll: builds only when the latest LedFx has no published image tag.
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/egeekial/ledfxdocker

jobs:
  resolve:
    name: Resolve LedFx release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: read
    outputs:
      version: ${{ steps.pypi.outputs.version }}
      should-build: ${{ steps.published.outputs.should-build }}
    steps:
      # GitHub disables scheduled workflows on repositories without recent
      # commits. Re-enabling on each scheduled run keeps the release poll alive.
      - name: Keep scheduled workflow enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/publish-image.yml/enable" \
            || echo "::warning::Could not refresh the workflow's enabled state."

      - name: Read latest LedFx version from PyPI
        id: pypi
        run: |
          version=$(curl --fail --silent --show-error --location --retry 5 --retry-all-errors --max-time 30 \
            https://pypi.org/pypi/LedFx/json | jq --raw-output .info.version)
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9A-Za-z]+)*$ ]]; then
            echo "::error::Unexpected LedFx version from PyPI: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event.schedule == '47 */6 * * *'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this release is already published
        id: published
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          VERSION: ${{ steps.pypi.outputs.version }}
        run: |
          should_build=true
          if [[ "$EVENT_SCHEDULE" == "47 */6 * * *" ]] \
            && docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            should_build=false
          fi
          echo "LedFx $VERSION; should build: $should_build"
          echo "should-build=$should_build" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: Smoke test
    needs: resolve
    if: needs.resolve.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ledfxdocker:smoke
          build-args: LEDFX_VERSION=${{ needs.resolve.outputs.version }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test critical-process recovery
        run: ./tests/smoke-restart.sh ledfxdocker:smoke

  build:
    name: Multi-architecture build
    needs: [resolve, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ needs.resolve.outputs.version }}
          build-args: LEDFX_VERSION=${{ needs.resolve.outputs.version }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
